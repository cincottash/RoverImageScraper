# Builds RoverImageScraper.exe on Windows.
#
# - Pull requests and manual runs: build the .exe and keep it as a downloadable artifact of the run (nothing is
#   published).
# - A pushed version tag (for example v1.0.0): build the .exe and publish a GitHub Release with it attached.
#   To make a release:   git tag v1.0.0   then   git push origin v1.0.0

name: Build Windows app

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to create the release on a tag push

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build the .exe
        shell: pwsh
        run: |
          python packaging/build_exe.py --out build-output
          $exe = Get-ChildItem build-output -Recurse -Filter RoverImageScraper.exe | Select-Object -First 1
          if (-not $exe) { throw "RoverImageScraper.exe was not built" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/RoverImageScraper.exe
          "Built dist/RoverImageScraper.exe ({0:N1} MB)" -f ($exe.Length / 1MB)

      - name: Check the .exe starts
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist/RoverImageScraper.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "RoverImageScraper.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          "RoverImageScraper.exe started and kept running"

      - name: Keep the .exe with this run
        uses: actions/upload-artifact@v4
        with:
          name: RoverImageScraper-exe
          path: dist/RoverImageScraper.exe
          retention-days: 14

      - name: Publish a release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/RoverImageScraper.exe `
            --title "Rover Image Scraper ${{ github.ref_name }}" --generate-notes
