# Builds the desktop app for Windows (RoverImageScraper.exe) and Linux (RoverImageScraper-x86_64.AppImage).
#
# - Pull requests and manual runs: build both, check that each starts, and keep them as downloadable artifacts of
#   the run for 14 days (nothing is published).
# - A pushed version tag (for example v1.1.0): also publish a GitHub Release with both files attached.
#   To make a release:   git tag v1.1.0   then   git push origin v1.1.0

name: Build apps

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to create the release on a tag push

jobs:
  windows:
    name: Windows .exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build the .exe
        shell: pwsh
        run: |
          python packaging/build_exe.py --out build-output
          $exe = Get-ChildItem build-output -Recurse -Filter RoverImageScraper.exe | Select-Object -First 1
          if (-not $exe) { throw "RoverImageScraper.exe was not built" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/RoverImageScraper.exe
          "Built dist/RoverImageScraper.exe ({0:N1} MB)" -f ($exe.Length / 1MB)

      - name: Check the .exe starts
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist/RoverImageScraper.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "RoverImageScraper.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          "RoverImageScraper.exe started and kept running"

      - uses: actions/upload-artifact@v4
        with:
          name: RoverImageScraper-windows
          path: dist/RoverImageScraper.exe
          retention-days: 14

  linux:
    name: Linux AppImage
    # The oldest supported Ubuntu, so the AppImage also runs on older distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install system libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-image0 \
            libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Get appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"      # runners have no FUSE; AppImages unpack themselves instead
        run: |
          python packaging/build_appimage.py --out build-output --appimagetool "$PWD/appimagetool"
          mkdir -p dist
          cp build-output/build-*/RoverImageScraper-x86_64.AppImage dist/
          ls -l dist

      - name: Check the AppImage starts
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/RoverImageScraper-x86_64.AppImage &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; echo "The AppImage exited early (code $?)"; exit 1; fi
          kill "$pid"
          echo "RoverImageScraper-x86_64.AppImage started and kept running"

      - uses: actions/upload-artifact@v4
        with:
          name: RoverImageScraper-linux
          path: dist/RoverImageScraper-x86_64.AppImage
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "Rover Image Scraper ${{ github.ref_name }}" --generate-notes \
            dist/RoverImageScraper.exe dist/RoverImageScraper-x86_64.AppImage
